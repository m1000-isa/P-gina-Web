<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">

    <title>Estructura con Columnas</title>
    <style>
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: #f8f9fa;
            padding: 10px 20px;
        }

        .logo-pequeno {
            width: 200px;
            height: auto;
            display: block;
        }

        .logo-mediano {
            width: 300px;
            height: auto;
            display: block;
        }


        .logo-cabecera {
            max-width: 100%;
            height: auto;
            display: block;
            margin-bottom: 15px;
        }

        .barra-navegacion {
            display: flex;
            gap: 15px;
            margin-top: 10px;
        }

        .boton-nav {
            text-decoration: none;
            color: black;
            background-color: blanchedalmond;
            padding: 6px 12px;
            border-radius: 4px;
            font-size: 14px;
            font-family: sans-serif;
            transition: background-color 0.3s;
        }

        .boton-nav:hover {
            background-color: rgb(245, 148, 1);
            color: beige;
        }
        
        
        main {
            display: flex;
            gap: 20px;

        }

        aside {
            width: 25%;

            background-color: #f0f0f0;
            padding: 15px;
        }


        section {
            width: 75%;
            background-color: #e0f7fa;
            padding: 15px;
        }
    </style>
</head>

<body>
    <header>
        <div>
            <h1 style="margin: 0;">Restaurante</h1>
            <nav>Menú de navegación</nav>
            <nav class="barra-navegacion">
                <a href="semantica.html" class="boton-nav activo">Inicio</a>
                <a href="semantica2.html" class="boton-nav">Reservaciones</a>
                <a href="semantica3.html" class="boton-nav">Contacto</a>
            </nav>
        </div>
        <img src="descarga.png" alt="logo del restaurante" class="logo-pequeno">
    </header>
    <main>
        <aside>
            <h3>Anunios y publicidad</h3>
            <p>Enlaces, publicidad o categorías.</p>
            <img src="anuncio.jpg" class="logo-cabecera">
            <img src="anuncio2.jpg" class="logo-cabecera">
            <img src="anuncio3.jpg" class="logo-cabecera">
        </aside>
        <section>
            <article>
                <h2>REDES SOCIALES</h2>
                <p>INSTAGRAM</p>
                <img src="redes.png" alt="redes sociales INSTAGRAM" class="logo-cabecera">
            </article>
        </section>
    </main>

    <footer>
        <p>Pie de página</p>
    </footer>

</body>

</html>
